[project]
name = "dictflow"
version = "0.1.0"
description = "Local dictation: hotkey -> ASR -> optional LLM cleanup -> paste"
requires-python = ">=3.11"
dependencies = ["parakeet-mlx", "mlx-whisper", "numpy"]

[project.scripts]
dictflow = "dictflow.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictflow"]
